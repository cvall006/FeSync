name: fesync
description: "FeSync"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  firebase_core: ^4.15.0
  cloud_firestore: ^6.10.0
  firebase_auth: ^6.7.0
  firebase_storage: ^13.6.0
  firebase_messaging: ^16.7.0
  cloud_functions: ^6.5.0

  flutter_local_notifications: ^22.3.1

  provider: ^6.1.5+1
  url_launcher: ^6.3.2
  google_sign_in: ^7.2.0
  image_picker: ^1.2.3
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo/fesync_logo.png"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/logo/fesync_logo.png"
    background_color: "#0F1115"
    theme_color: "#0F1115"
  windows:
    generate: true
    image_path: "assets/logo/fesync_logo.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/logo/fesync_logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/google.png
    - assets/logo/fesync_logo.png
    - assets/logo/Logo1.png
